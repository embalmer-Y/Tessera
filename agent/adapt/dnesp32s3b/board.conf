# SPDX-License-Identifier: Apache-2.0
# BV2 适配接入件：xtensa 板级片段（LLD-A17 · DEC-74 产物）。
# 架构注记：Xtensa 缺省 4096（persistbench 同口径）。
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384

# 网络内存家族（BV2 net 模板——deploybench xiao 基线，DEC-29 预算）：
# WAMR 实例堆入 PSRAM（WiFi+zenoh+WAMR 三合一 DRAM 装不下）；
# PSRAM 形态 = OCT（调用方提供——板载颗粒/模式须按原理图或
# flash-id 实测核对，推定态如不符请人工修订）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
# 堆 131072→98304：C0 构建实测 dram0 溢出 25164B（xiao 基线值携其板级
# 裁剪语境，atk 静态面装不下）——MP 每板预算纪律实测敲定，余量 ~7.6KB。
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# PWM 后端面（板载 LED pin = IO4——调用方硬件事实）：
CONFIG_PWM=y
CONFIG_TS_DRV_PWM=y
# main 栈 8192 = xtensa verify 链实测口径（教训 31⑤）
CONFIG_MAIN_STACK_SIZE=8192
