# xiao_esp32s3 板级基准配置（2026-09-26 板级二）
# 内存过渡值同 firmware/app（DEC-23/27，PSRAM 挂接前）。
# 注：Zephyr 4.4 ESP32-S3 无 SMP（espressif 双核 = AMP 独立镜像，SOC_ENABLE_APPCPU；
# kernel SMP 钩子 arch_cpu_start 无实现——构建实证 2026-09-26）。
# DoD ⑥ 在本板降级为单核抢占并发（Q-24 已登记呈 owner 裁决双核终验载体）。
CONFIG_TS_STORE_SLOT_SIZE=32768
# 宿主栈：实验基线 32KB（16K 亦实测可用——本基准取基线值）。

CONFIG_TS_APP_THREAD_STACK=32768
