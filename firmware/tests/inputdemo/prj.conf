# inputdemo（单元 F：G3 + D4/D6 输入 demo）：ADC 真值 → input monitor 事件
# → APP mailbox 路由全链（无 WiFi/zenoh——本地判据）。
# 组合 = deploybench 通道面（PWM/ADC 真后端 + flash store + WAMR）+
# dsdbench 安装模式（内嵌包）+ input monitor 启动（G3）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_STORE=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TS_STORE_FLASH=y
CONFIG_REBOOT=y

# 输入面（G3）：input monitor 周期轮询（sysworkq）
CONFIG_ADC=y

# PWM 真后端（dbpwm，D6 控制环输出；TS_DRV_* 自带驱动依赖 select）
CONFIG_TS_DRV_PWM=y
CONFIG_TS_DRV_ADC=y

# 看门狗（DEC-48 常设）
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000

CONFIG_MAIN_THREAD_PRIORITY=15
