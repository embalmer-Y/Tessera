# pdmdemo（V2 纵深 M18）：D-PDM demo 真机载体——pcm16 音频全链
# （DEC-54② 既定③执行：Q-36/DEC-54② 采集→分片发布→PC 落盘）。
# 组合 = avdemo 克隆（WiFi+zenoh+框架 net+flash store+WAMR+TS_HAL_AV）
# − 摄像头栈（无 VIDEO/I2C/视频池）+ TS_DRV_PDM（M17b 板级后端）。
# 凭证经 cmake 变量注入（本地脚本，不入仓库）。

# Tessera 框架全量
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_HAL_AV=y
CONFIG_TS_DRV_PDM=y
CONFIG_TS_STORE=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TS_STORE_FLASH=y
CONFIG_REBOOT=y
CONFIG_PRINTK=y
CONFIG_CACHE_MANAGEMENT=y

# 网络：WiFi STA + DHCPv4 + lwIP（netbench/deploybench 同档）
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_NET_MAX_CONTEXTS=12

# zenoh-pico（DR-22 钉 1.10.1；deploybench 同档）
CONFIG_TS_NET=y
CONFIG_TS_NET_ZENOH=y
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_POSIX_API=y

# 三合一 DRAM 档（WiFi + zenoh + avq；avdemo 板级档随板 conf 裁）
CONFIG_HEAP_MEM_POOL_SIZE=188416
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_ENTROPY_GENERATOR=y

# 看门狗（DEC-48 起常设）
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000

# 主线程降优先级（bench 同款：net_wq 8 / APP 10 优先于观测线程）
CONFIG_MAIN_THREAD_PRIORITY=15
