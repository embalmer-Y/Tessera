# pdmdemo（V2 纵深 M18）：内存形态 = avdemo 档（框架全量 × 单实例 WAMR）
# − 摄像头栈静态（无 VIDEO）+ PDM 静态（~3KB：驱动 + 4×640B 环 + 描述符）。
# 池 94208 = avdemo 带视频实证档（去视频后裕量更大，不追高）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=16384
CONFIG_TS_APP_LOAD_MAX=8192
CONFIG_HEAP_MEM_POOL_SIZE=94208
# 验签双区 scratch（DEC-49：demo.dpm payload ~2.5KB → 7168 充裕）
CONFIG_TS_VERIFY_SCRATCH=7168
# verify 链 4096 main 栈挂死防御（教训 31⑤ 同型）；8192 定值
CONFIG_MAIN_STACK_SIZE=8192
# 64B 分片档定版（V2-1 绕行——上游 zenoh-pico 大 payload 缺陷域）
CONFIG_TS_NET_PUBLISH_MAX_BYTES=64
