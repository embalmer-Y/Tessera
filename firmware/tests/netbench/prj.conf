# netbench（板级四）：WiFi + zenoh 命令往返时延（xiao_esp32s3）。
# zenoh 块沿 l3app 已验证配置（dev-environment §7/§8）；网络块换 WiFi+DHCP。
# 凭证经 cmake 变量注入（本地脚本，不入仓库）。

# Tessera 框架（纯网络路径：无 WAMR/APP——命令往返不依赖运行时）
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_NET=y
CONFIG_TS_NET_ZENOH=y
CONFIG_TS_TEST=y
CONFIG_TS_APP_WAMR=n
CONFIG_TS_STORE=y

# zenoh-pico（DR-22 钉 1.10.1）
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_POSIX_API=y

# 网络：WiFi STA + DHCPv4 + lwIP
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_WIFI=y
CONFIG_NET_MAX_CONTEXTS=12

# zenoh-pico 会话/读任务内存（l3app 实测档位；真板 DRAM 紧张，见板级 conf）
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=5120
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16

CONFIG_ENTROPY_GENERATOR=y
CONFIG_PRINTK=y
# WiFi 排障一档（诊断批；定位后回落）
# CONFIG_WIFI_LOG_LEVEL_DBG 诊断批已回落（netbench-01 数据采集期用过）
