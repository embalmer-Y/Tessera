# netbench 板级配置：slot 缩到最小（prov 只用小角落数据；APP 关）。
CONFIG_TS_STORE_SLOT_SIZE=4096
# 板级七：ts-net 周期体迁专用工作队列（栈 4096）——系统池让 8KB
#（zenoh open/close 已迁离原调用路径，池峰值域不变；原 196608 为板级四调值）。
# MP 基线批（2026-10-19）：4.5-rc1 + R5 静态面（shell/log/interact）下
# dram0 溢出 3492B——153600→147456（−6144，余 ~2.6K 链接余量；最低 net 档
# 实测口径，docs/memory-baseline.md）。
CONFIG_HEAP_MEM_POOL_SIZE=139264
# MP 审计 R1/R2 双 fail（2026-10-19 首战抓获——FIX-1/R5-V③ 同型缺陷在
# netbench 潜伏：rx_q 栈 2048（部署突发压穿 FATAL 风险）+ sysworkq 缺省
# 1024（zenoh 建链窗溢出/静默腐蚀风险）→ 双 4096；heap 再让 8192 承接）。
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# 4.5 复验批（同型防御）：verify 链在 4096 main 栈实测挂死（persistbench
# 实证——教训 31⑤ 同型）；8192 定值。
CONFIG_MAIN_STACK_SIZE=8192
