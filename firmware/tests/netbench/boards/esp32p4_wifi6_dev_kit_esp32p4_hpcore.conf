# netbench P4 板级（P4 无线面批）：WiFi 经 C6 伴芯（esp_hosted SDIO——
# 板 dts esp_hosted_mcu + wifi 子节点树内就绪 status okay，overlay 无需
# 再动 WiFi 节点）。内存面 = S3 板级七同档（P4 HP SRAM 充裕，起值平移；
# 溢出再调）。main 栈 8192 = 教训 31⑤（RV32 帧深）。
CONFIG_TS_STORE_SLOT_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=188416
CONFIG_MAIN_STACK_SIZE=8192
# esp_hosted 面（P4 板）：C6 协处理器 RPC + SDIO 传输 + WiFi 驱动
CONFIG_ESP_HOSTED_MCU=y
CONFIG_ESP_HOSTED_MCU_SDIO=y
CONFIG_WIFI_ESP_HOSTED=y
