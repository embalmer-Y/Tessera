# SPDX-License-Identifier: Apache-2.0
# cambench（MD1.2b）：摄像头 bring-up——Sense 板（OV2640 + DVP + SD）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_APP_WAMR=n
CONFIG_TS_NET=n
CONFIG_MAIN_THREAD_PRIORITY=15
CONFIG_MAIN_STACK_SIZE=4096

# video 子系统（Sense DT：chosen zephyr,camera = lcd_cam_dvp + ov2640）
CONFIG_VIDEO=y
CONFIG_VIDEO_OV2640=y
CONFIG_I2C=y
CONFIG_DMA=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# SD（帧落盘）
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y
CONFIG_SPI=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_LOG=y

CONFIG_VIDEO_LOG_LEVEL_DBG=y
CONFIG_DMA_LOG_LEVEL_WRN=y
CONFIG_I2C_LOG_LEVEL_WRN=y
# QVGA RGB565 153600B / 4095B 每描述符 → 需 38（默认 16 不够）
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=48
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=262144
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=6
