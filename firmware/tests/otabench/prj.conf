# SPDX-License-Identifier: Apache-2.0
# otabench（单元 G2）：MCUmgr OTA——MCUboot（sysbuild 子镜像）+ SMP 串口
# （DEC-23 UART 救砖底线）。UDP 传输受 WSL mirrored Hyper-V 防火墙面阻挡
# （owner UAC 手动步骤，登记）——串口线协议不受此面影响。

# 框架最小面（无 zenoh/无 APP/无 store——OTA 证据 = 固件版本链）
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_NET=n
CONFIG_TS_APPMGR=n
CONFIG_TS_APP_WAMR=n
CONFIG_TS_STORE=n
CONFIG_TS_PERIPH=n
CONFIG_TS_POWER=n
CONFIG_TS_HAL=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=15

# 网络：WiFi STA + DHCPv4（netbench 同档；保留网络面供遥测/alive）
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_ENTROPY_GENERATOR=y

# MCUmgr：SMP over UDP（WiFi）—— 串口 shell 传输不可用（USB serial JTAG
# 控制台无 UART_CONSOLE_MCUMGR 透传 = esp32s3 平台限制，如实登记）
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_AUTOMATIC_INIT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# 看门狗（DEC-48 常设）
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000

# 日志（SMP 调试期）
CONFIG_LOG=y
