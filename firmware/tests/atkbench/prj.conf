# SPDX-License-Identifier: Apache-2.0
# deploybench（板级十）：Agent→真机完整部署 E2E 板侧载体。
# 组合 = netbench（WiFi+zenoh+命令面）+ persistbench（flash 后端+WAMR+分步
# 安装）。prov 首启经 TS_TEST 烧入 flash（此后每次复位出自 flash——板级五
# 语义）；APP 由 Agent 侧经 zenoh 分块部署（client.py 复用 Agent deploy 链）。

# Tessera 框架（部署面全量：net + WAMR 运行时 + flash store）
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_NET=y
CONFIG_TS_NET_ZENOH=y
CONFIG_TS_TEST=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_STORE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TS_STORE_FLASH=y
CONFIG_REBOOT=y

# zenoh-pico（DR-22 钉 1.10.1；netbench 同档）
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_POSIX_API=y

# 网络：WiFi STA + DHCPv4 + lwIP（netbench 同档）
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_WIFI=y
CONFIG_NET_MAX_CONTEXTS=12

# zenoh-pico 会话/读任务内存（netbench 档位）
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16

CONFIG_ENTROPY_GENERATOR=y
CONFIG_PRINTK=y
# 主线程降优先级（bench 同款：net_wq 8 / APP 10 优先于观测线程）
CONFIG_MAIN_THREAD_PRIORITY=15

# K3 前置：信任根表分区上板（atkbench = 信任链真机 E2E 载体）
CONFIG_TS_STORE_TRUST=y

# K2（Q-44/DEC-61）：ES8311 音频输入输出（av 面 + 全 codec 后端 + I2C 控制）
CONFIG_TS_HAL_AV=y
CONFIG_TS_DRV_ES8311=y
CONFIG_I2C=y

# K4（net+SD 资源推送 E2E）：SD 卡栈（dsdbench 同款——atk 板载 TF 槽 SPI2）
# + ts-fs 面（fs natives + fs_paths manifest 门）
CONFIG_TS_HAL_FS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_TS_PERIPH=y

# F3（DEC-62② owner 修订）：LCD 本地确认路呈现面 = LVGL（树内 ST7789V 走
# esp32 lcd_cam 并口 MIPI-DBI——板 DTS chosen 已挂；背光 = XL9555 P0-7
# 裸 I2C〔pca9555 驱动维持禁用——K2 es8311 互踩规避同源〕）。呈现属设备
# 形态面非安全面（R10 §6）；文本面 ASCII（Montserrat 14——CJK 字库不入 V1）。
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
# DRAM 预算（F3-1 三轮实证）：LV_MEM_SIZE_KILOBYTES 为死配置（glue 强制
# LV_STDLIB_CUSTOM）；LVGL 全部分配走 LV_Z_MEM_POOL——**2048 缺省/6144 均
# 运行时崩**（cache/theme 样式 NULL 写，EXCCAUSE 29/28 真机实证），
# **16384 = 运行时下限**（全链绿实证）；HEAP_LIB_C 路径亦崩（上游域）。
# VDB 3%（≈4.6KB 静态）。WiFi 归因更正：恒 -22 = 空凭据烤入（env.sh 变量
# 名 TS_WIFI_* 非 DEPLOYBENCH_*——CMakeLists 已加空凭据守卫）。
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=1

# P1-2（DEC-63）：TLS mTLS 命令面（tls/ locator + prov 15 键三元组）。
# ZENOH_PICO_LINK_TLS = 仓携带补丁面（ext/zenoh-pico-tls.patch——上游 1.10.1
# Zephyr 集成缺特性行，DEC-63①）；内容长钳 4096（握手面 EC 证书链 <4KB 实测）
# + mbedtls 专用静态堆 16KB（握手缓冲有界化——Q-47⑤ 内存纪律：不与系统池混跑）。
CONFIG_ZENOH_PICO_LINK_TLS=y
CONFIG_TS_NET_TLS=y
CONFIG_MBEDTLS=y
# 实测设计事实（DEC-63④ E2E 期定案）：zenohd 1.10.1（rustls）**仅收 TLS1.3**
# （TLS1.2-only 客户端 alert 70——openssl s_client 实证）；板侧双协议使能
# （1.3 对 zenohd，1.2 留未来服务端）
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# ECDHE-ECDSA + AES-128-GCM-SHA256 相干集（DEC-63⑤ 有界化——伞形全集会被
# Kconfig 依赖链要求 RSA/JPAKE 等额外 PSA want，flash 代价大）
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# tf-psa-crypto 相干集（EC P-256 全链：X509 解析 → PK → ECDHE-ECDSA）
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
# TLS1.3 key_share 缺省组含 X25519（rustls 服务端亦偏好）——PSA want 缺失
# = 板侧握手本地失败（zenohd 无到达痕迹实证）；SHA-384 = 握手转录面补齐
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=31744
CONFIG_MBEDTLS_BASE64_C=y
