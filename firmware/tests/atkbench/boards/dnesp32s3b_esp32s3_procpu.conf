# K1：ATK DNESP32-S3B 内存/后端片段 = deploybench 同档（PSRAM 八线 8MB +
# WAMR 256KB 入 PSRAM + 系统池 netbench 档）。K5：large 档开放（槽 256KB
# + LOAD_MAX 262144 + 装载缓冲 PSRAM 化——caps.tiers 自报 [small,large]）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=524288
CONFIG_TS_STORE_SLOT_SIZE=524288
# K1 122880 → F3-1 102400 → P1 批 98304 → P1-2 TLS 69632：LVGL 呈现面
# （16KB 专用池 + VDB + UI 线程栈）+ P1 静态面（msg FIFO/perm 名单）+
# **TLS 面**（mbedtls 专用堆 16KB + prov_tls 1.8KB + glue b64 暂存 2.7KB
# + PSA/ssl 静态——DEC-63⑤ 重平，溢出 5660B 实证驱动）。WiFi -22 归因
# 更正 = 空凭据烤入（非堆不足——CMakeLists 守卫防再犯）。
# → V0.16.0 平移 58368 → 50176 → 41984（Zephyr v4.5.0-rc1 → v4.5.0 正式
# 版收口静态面再涨——dram0 溢出 6716B→-8192 后余溢 4732B→再 -8192 构建绿；
# bss 大头 mbedtls 31KB/tessera 18.8KB/lvgl 16.6KB 无单域暴涨 = 全域累积。
# 构建级判定，真机复验待凭据配置后重烧）。
CONFIG_HEAP_MEM_POOL_SIZE=61440
# R2（DEC-64②）：RCVTIMEO 静态面（net_context 选项 + sockets rodata）溢出
# 140B 实证驱动——bench 仅 1 条 zenoh context，12→4 释放富余（每 context
# 数百 B 静态数组）。
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_TS_APP_LOAD_MAX=262144
CONFIG_TS_APP_PSRAM_LOAD_BUF=y
# PWM 后端（板载 LEDB = IO4；deploybench 同款绑定）
CONFIG_PWM=y
CONFIG_TS_DRV_PWM=y
CONFIG_TS_SAFETY_MAX_CHANNELS=4
# 验签双区 scratch + 8192 主栈（4.5 帧深防御——教训 31⑤ 同型）
CONFIG_MAIN_STACK_SIZE=8192
# 双实例并行 + 槽池 4（overlay 槽 c/d）+ kv
CONFIG_TS_APP_MAX_INSTANCES=2
CONFIG_TS_STORE_SLOT_COUNT=4
CONFIG_TS_APP_THREAD_STACK=8192
CONFIG_TS_STORE_KV=y
CONFIG_TS_VERIFY_SCRATCH=430080
CONFIG_TS_APP_PSRAM_VERIFY_BUF=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
# R5-V①（DEC-65）：pico pthread 栈池 4→2——执行器单线程设计（单 executor
# 轮转 read/lease/keep-alive 三 fut，一槽运行一槽备援），每槽 8192 =
# MAIN_STACK 同源（system.c Z_PTHREAD_STACK_SIZE_DEFAULT）。省 16384B
# 静态 DRAM（map 实证 = system.c 32KB 大头）换 shell/log 静态面 + 堆余量。
CONFIG_ZENOH_PICO_THREADS_NUM=2
# R5-V②（DEC-65①）：单 UART 三合一——SHELL+SHELL_LOG_BACKEND+LOG 汇
# printk 正牌路径；CONSOLE=n 防双路；IMMEDIATE（无 log 线程栈，DRAM 省
# ~2KB；日志序与终端序一致）。
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=n
CONFIG_TS_INTERACT=y
# R5-V③ 真机定案：shell 栈 2048 缺省装不下 confirm 链（stage_commit 的
# meta flash 写 + shell_print——2026-10-18 EXCCAUSE 0 野跳 FATAL，AKP2 后
# 即崩实证）→ 4096（重平余量内）；SENTINEL = 溢出从静默腐蚀变点名 FATAL。
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
# R5-V③ 真机定案（SENTINEL 点名）：sysworkq 栈 = 板缺省 1024，WiFi/DHCP
# 事件在 zenoh 建链窗溢出（boot+7s Stack overflow on sysworkq 实证）——
# 此前无 SENTINEL 即静默腐蚀（同象嫌疑：EXCCAUSE 0 野跳族）→ 4096。
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
