# SPDX-License-Identifier: Apache-2.0
# K1：ATK DNESP32-S3B 内存/后端片段 = deploybench 同档（PSRAM 八线 8MB +
# WAMR 256KB 入 PSRAM + 系统池 netbench 档）。K5：large 档开放（槽 256KB
# + LOAD_MAX 262144 + 装载缓冲 PSRAM 化——caps.tiers 自报 [small,large]）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=524288
CONFIG_TS_STORE_SLOT_SIZE=524288
# K1 122880 → F3-1 102400 → P1 批 98304 → P1-2 TLS 69632：LVGL 呈现面
# （16KB 专用池 + VDB + UI 线程栈）+ P1 静态面（msg FIFO/perm 名单）+
# **TLS 面**（mbedtls 专用堆 16KB + prov_tls 1.8KB + glue b64 暂存 2.7KB
# + PSA/ssl 静态——DEC-63⑤ 重平，溢出 5660B 实证驱动）。WiFi -22 归因
# 更正 = 空凭据烤入（非堆不足——CMakeLists 守卫防再犯）。
CONFIG_HEAP_MEM_POOL_SIZE=58368
# R2（DEC-64②）：RCVTIMEO 静态面（net_context 选项 + sockets rodata）溢出
# 140B 实证驱动——bench 仅 1 条 zenoh context，12→4 释放富余（每 context
# 数百 B 静态数组）。
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_TS_APP_LOAD_MAX=262144
CONFIG_TS_APP_PSRAM_LOAD_BUF=y
# PWM 后端（板载 LEDB = IO4；deploybench 同款绑定）
CONFIG_PWM=y
CONFIG_TS_DRV_PWM=y
CONFIG_TS_SAFETY_MAX_CHANNELS=4
# 验签双区 scratch + 8192 主栈（4.5 帧深防御——教训 31⑤ 同型）
CONFIG_MAIN_STACK_SIZE=8192
# 双实例并行 + 槽池 4（overlay 槽 c/d）+ kv
CONFIG_TS_APP_MAX_INSTANCES=2
CONFIG_TS_STORE_SLOT_COUNT=4
CONFIG_TS_APP_THREAD_STACK=8192
CONFIG_TS_STORE_KV=y
CONFIG_TS_VERIFY_SCRATCH=430080
CONFIG_TS_APP_PSRAM_VERIFY_BUF=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
