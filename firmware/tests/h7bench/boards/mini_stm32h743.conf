# H7 移植批板级片段（WeAct MiniSTM32H743：STM32H743VIT6，2MB 内部 flash，
# sram0 512KB 链接域）。slot = 128KB（H743 擦除块 128KB——ts 五分区每区
# 独占一个扇区，见 overlay 注）；main 栈 8192（P4 批 RV32 溢出教训的保守
# 起值；H7 sram0 充裕无成本）。
CONFIG_TS_STORE_SLOT_SIZE=131072
CONFIG_TS_APP_THREAD_STACK=16384
CONFIG_MAIN_STACK_SIZE=8192
