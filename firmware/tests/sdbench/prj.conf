# sdbench（MD1.2a）：SD bring-up——无网面无 APP。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_APP_WAMR=n
CONFIG_TS_NET=n
CONFIG_MAIN_THREAD_PRIORITY=15

# SD 子系统（SPI 模式：Sense 卡槽 CS21/SCK7/MISO8/MOSI9）
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y


CONFIG_SPI=y

# 文件系统（FatFS）
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_POSIX_API=n
CONFIG_MAIN_STACK_SIZE=4096
