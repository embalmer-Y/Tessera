# zenoh-pico 绑定编译验证 overlay（M3a.1；L3 端到端联调随 M3a.2/MA3）。
# 用法（工作区须先接入 zenoh-pico，见 docs/dev-environment.md §7）：
#   west build -p -b native_sim firmware/tests/net -d <build_dir> -- \
#     -DZEPHYR_EXTRA_MODULES="<tessera module>;<zenoh-pico checkout>" \
#     -DEXTRA_CONF_FILE=firmware/tests/net/overlay-zenoh.conf
# 关键项：CONFIG_POSIX_API——zenoh-pico Zephyr 平台层的 <netdb.h>/<sys/socket.h>
# 经 Zephyr POSIX API 解析（host libc 直引会与 Zephyr net_ip.h 结构冲突）。
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_TS_NET_ZENOH=y
CONFIG_POSIX_API=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
