# P4-W2（V0.14.0）网络面追加 conf——EXTRA_CONF_FILE 注入（缺省 p4bench 保持
# 无网形态不变：TS_NET=n 持久链判据不受扰）。WiFi = esp_hosted_mcu 新驱动
# （P4-W1 p4wifibench 同款已验链）；zenoh = TS_NET_ZENOH（RCVTIMEO/SNDTIMEO
# 由 Kconfig select 兜底——R2 教训）。
CONFIG_TS_NET=y
CONFIG_TS_NET_ZENOH=y
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
# FIX-1/R1 族纪律（rx ≥4096——驱动缺省 2560）+ R2（sysworkq ≥4096）+ R2 时代
# 上下文面（NET_MAX_CONTEXTS 权威 = 4）
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# zenoh-pico Zephyr 平台 = pthread 族（atkbench/netbench 同款面）
CONFIG_POSIX_API=y
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_DYNAMIC_THREAD_POOL_SIZE=4
CONFIG_THREAD_STACK_INFO=y
# 系统堆（zenoh-pico z_malloc 走 k_malloc 系统堆——4096 缺省 = z_open
# rc=-78 OOM 实测）。48KB = sram0_0_seg 余量实测推算（131072 溢出 79968B
# → 头 room ≈51KB；PSRAM 重平随板级批）。z_open 实测域 ≈20-30KB 内绰绰）
CONFIG_HEAP_MEM_POOL_SIZE=49152
