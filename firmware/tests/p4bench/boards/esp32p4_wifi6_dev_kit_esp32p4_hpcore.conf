# P4 bring-up 板级片段（ESP32-P4-WIFI6-DEV-KIT，Waveshare）：内存面与 S3
# persistbench 同过渡值（PSRAM 挂接前；DEC-23/27）。P4 HP SRAM 充裕，
# 后续批按 HLD §4.6 每板动态预算再定值。
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
# RV32 调用帧比 Xtensa 深：4096 main 栈在安装链（meta 读 → slot 擦写）
# 实测溢出（sp 越栈底 0x230，Illegal instruction @ 表数据）。8192 实测定值。
CONFIG_MAIN_STACK_SIZE=8192
