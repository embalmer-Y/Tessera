# p4bench（P4 适配批）：persistbench 源级复用——P4 板 bring-up 判据
# 首启 = 烧录会话（TS_TEST prov 注入通道〔合同 10：写通道仅烧录期/测试构建〕
# + 分步安装链 + activate）→ 暖复位；此后每次复位 = 全部状态出自 flash。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
# 本基准无网面（板级四已测）：关 ts-net，避免 linkmon 无传输时按合同 3
# 将通道压入 linkloss 态（真机已观测该行为正确生效——留痕报告）。
CONFIG_TS_NET=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TS_STORE_FLASH=y
CONFIG_REBOOT=y
# 主线程降优先级（boardbench 同款：APP 线程 10 优先投递，校验线程轮询不饿死）
CONFIG_MAIN_THREAD_PRIORITY=15
