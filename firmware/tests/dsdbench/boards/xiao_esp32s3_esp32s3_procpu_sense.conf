# dsdbench（MD1.2f）：内存形态 = wdtbench 同款（PSRAM 承 WAMR 堆；无网络面）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_LOAD_MAX=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
# 验签双区 scratch（DEC-49：payload ~2.7KB → 5616）
CONFIG_TS_VERIFY_SCRATCH=6144
# 4.5 复验批（同型防御）：verify 链在 4096 main 栈实测挂死（persistbench
# 实证——教训 31⑤ 同型）；8192 定值。
CONFIG_MAIN_STACK_SIZE=8192
