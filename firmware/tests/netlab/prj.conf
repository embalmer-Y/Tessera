# SPDX-License-Identifier: Apache-2.0
# L3 联调镜像（native_sim ↔ host zenohd；host = TAP zeth 192.0.2.2）
# 运行：./zephyr.exe --tap=zeth（zenohd 先行监听 tcp/0.0.0.0:7447）

# Tessera 框架（含 boot net_init；TS_TEST = prov 注入通道）
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_NET=y
CONFIG_TS_NET_ZENOH=y
CONFIG_TS_TEST=y

# zenoh-pico（DR-22 钉 1.10.1；queryable = sys 命令面，M3a.2 起）
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_SUBSCRIPTION=y
CONFIG_ZENOH_PICO_QUERYABLE=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_LINK_UDP_UNICAST=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y

# zenoh-pico Zephyr 平台层关键项（dev-environment.md §7-3）
CONFIG_POSIX_API=y

# 网络：native TAP（Zephyr 4.4 = ETH_NATIVE_TAP，默认接口 zeth）+ 静态 IPv4
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
# zenoh-pico Zephyr 平台 getaddrinfo（数字地址解析亦经解析器）
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
CONFIG_NET_MAX_CONTEXTS=12

# zenoh-pico 会话/读任务内存（官方 Zephyr 例程档位 120-150K；实测握手后
# 会话建立（读任务线程 + 批缓冲）需更多 → 192K + pthread 栈 8K）
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=5120
# pthread 动态栈分配（zenoh-pico MULTI_THREAD 读任务；无此项 pthread_create=EINVAL）
# 注意依赖链：DYNAMIC_THREAD depends on THREAD_STACK_INFO（缺则被静默丢弃）
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
# POSIX 对象静态池（默认 5——zenoh 会话 tx/rx/lease 互斥量即超限 → ENOMEM）
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_PRINTK=y
