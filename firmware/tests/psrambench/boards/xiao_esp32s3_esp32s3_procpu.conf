# DEC-27 / HLD §4.6 esp32s3 每板默认：WAMR 实例堆 256KB 入 PSRAM。
# xiao_esp32s3 = N8R8 模组（8MB 八线 PSRAM）→ SPIRAM_MODE_OCT 必须显式
# （默认 QUAD 探测失败 = esp_init_psram 硬停）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
# 板级内存片段（DEC-23/27 过渡值；RAM slot 后端数组按此尺寸编入）
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
