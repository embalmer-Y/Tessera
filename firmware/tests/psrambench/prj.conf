# psrambench（板级六）：PSRAM 挂接验证——SMH 探针（读写一致性 + 外部 RAM
# 地址域）+ WAMR 实例堆入 PSRAM（DEC-27 #10 池模式，HLD §4.6 分层纪律）
# + APP 全链运行。直启面（framework.app 同款，无 core_boot）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_APP_WAMR=y
# 本基准无网面/无持久化（板级四/五已测）
CONFIG_TS_NET=n
CONFIG_MAIN_THREAD_PRIORITY=15
