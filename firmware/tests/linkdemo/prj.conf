# linkdemo（单元 I / MD2-D9）：输入-逻辑-输出 + 断链时间线——D9 APP 滞回控制
# 环 + 强制断链 fail-safe + 自愈恢复（无 WiFi/zenoh——本地判据；inputdemo 同型）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_STORE=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TS_STORE_FLASH=y
CONFIG_REBOOT=y

# 输入面（G3）：input monitor 周期轮询（sysworkq）——断链期事件照常投递（合同 3）
CONFIG_ADC=y

# PWM 真后端（dbpwm，D9 控制环输出）
CONFIG_TS_DRV_PWM=y
CONFIG_TS_DRV_ADC=y

# 看门狗（DEC-48 常设）
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000

CONFIG_MAIN_THREAD_PRIORITY=15
