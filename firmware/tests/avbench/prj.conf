# SPDX-License-Identifier: Apache-2.0
# avbench（MD1.2d spike）：视频帧 zenoh 分片传输真机测量——Sense 板。
# 隔离设计：不经 ts-net 框架（传输层独立测量）——无 CONFIG_TS_*。
# 凭证经 cmake 变量注入（本地脚本，不入仓库）。

# zenoh-pico（DR-22 钉 1.10.1；仅需发布面 + TCP + 多线程后台任务）
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_PUBLICATION=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_POSIX_API=y

# 网络：WiFi STA + DHCPv4 + lwIP（netbench 同款）
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_NET_MAX_CONTEXTS=12
# lwIP TX 池调档（官方 tcpserversink 样例同款方向——默认池在背靠背大
# payload 下疑耗尽〔z_put 报 -100 = _Z_ERR_TRANSPORT_TX_FAILED〕；
# 512×1KB 静态缓冲致 DRAM 溢出 510KB，先以小档验证方向再定档）
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_BUF_DATA_SIZE=512

# zenoh-pico 会话/读任务内存（deploybench 板级实证档位：188416）
CONFIG_HEAP_MEM_POOL_SIZE=188416
CONFIG_MAIN_STACK_SIZE=5120
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16

CONFIG_ENTROPY_GENERATOR=y
CONFIG_PRINTK=y

# video 子系统（cambench 同款：Sense DT OV2640 + DVP）
CONFIG_VIDEO=y
CONFIG_VIDEO_OV2640=y
CONFIG_I2C=y
CONFIG_DMA=y
# 池入 PSRAM（SMH 属性 2 = SMH_REG_ATTR_EXTERNAL——psrambench 同机制先例；
# 内部 DRAM 留给 WiFi+zenoh 会话域，deploybench 三合一教训的反向应用）
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=48
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=262144
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=6

CONFIG_LOG=y
CONFIG_VIDEO_LOG_LEVEL_WRN=y
CONFIG_DMA_LOG_LEVEL_WRN=y
CONFIG_I2C_LOG_LEVEL_WRN=y
