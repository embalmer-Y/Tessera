# avdemo（MD1.2h）：内存形态 = 三合一（WiFi+zenoh+视频）× 框架全量。
# 档位推导：deploybench（框架全量 196608）− 视频栈静态 − slot 缓冲
# （16KB——D-AV 包 6112B）= 131072；DRAM 首构建证（溢出 60KB @ 188416+32KB）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=16384
CONFIG_TS_APP_LOAD_MAX=8192
CONFIG_HEAP_MEM_POOL_SIZE=94208
# 验签双区 scratch（DEC-49：2*(84+payload 3477) = 7122）
CONFIG_TS_VERIFY_SCRATCH=7168
# 4.5 复验批（同型防御）：verify 链在 4096 main 栈实测挂死（persistbench
# 实证——教训 31⑤ 同型）；8192 定值。
CONFIG_MAIN_STACK_SIZE=8192
