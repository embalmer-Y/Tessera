# wdtbench（DEC-48 实施批）：看门狗接线真机验证（无网络面——纯本地链路）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_STORE=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=15

# DEC-48④ L3/L4 真机层：task_wdt 硬件回退（esp32 MWDT）
# 硬 WDT ≈ MIN_TIMEOUT + FALLBACK_DELAY = 10s（对齐 TS_HARD_WDT_CAP_MS）
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000
