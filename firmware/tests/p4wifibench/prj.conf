# P4 联网批 E1（V0.14.0）：C6 伴芯 esp-hosted-mcu 新驱动 bring-up。
# 判据链：SLC ready → buf-config 协商（SW_AGGR/STREAM 识别）→ RPC 版本
# 握手 → wifi_connect → DHCP（数据面首战场——教训 32⑤ 病灶位）→ UDP 回环。
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_WIFI=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_DBG=y
# FIX-1/R1 族纪律：rx 栈 ≥4096（驱动缺省 2560——net TC RX 线程同族）；R2 sysworkq ≥4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# RV32 调用帧深（教训 31⑤）：main 8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
