# 板级十：内存片段 = persistbench（slot 32KB/APP 线程栈 16KB）+ netbench
# （系统池 188416——板级七 net_wq 迁离后让 8KB 档位）+ psrambench（WAMR
# 实例堆 256KB 入 PSRAM——板级六；WiFi+zenoh+WAMR 三合一 DRAM 装不下内部堆）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
CONFIG_HEAP_MEM_POOL_SIZE=188416
# DRAM 三合一（WiFi+zenoh+WAMR）装不下默认值——DEC-29 每板动态预算裁剪：
# 装载缓冲按夹具尺寸级（286B wasm + 余量）；通道容量按本载体实际注册数
# （1 通道 dbled，留 8）。系统池不动（zenoh 会话峰值域 = 板级七实测档位）。
CONFIG_TS_APP_LOAD_MAX=2048
# MD1.1（板级十一）：PWM 后端（D3 demo 限幅判据；periphbench 同款绑定）
CONFIG_PWM=y
CONFIG_TS_DRV_PWM=y
# PWM 驱动并入后 dram 再紧——通道容量 8→4（本载体注册 2 通道：dbled/dbpwm）
CONFIG_TS_SAFETY_MAX_CHANNELS=4
