# 板级十：内存片段 = persistbench（slot 32KB/APP 线程栈 16KB）+ netbench
# （系统池 188416——板级七 net_wq 迁离后让 8KB 档位）+ psrambench（WAMR
# 实例堆 256KB 入 PSRAM——板级六；WiFi+zenoh+WAMR 三合一 DRAM 装不下内部堆）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
# 单元 I（MD2-D8）：模块静态面增长（单元 A avq/F 输入数组/D net_wq 栈）
# 超出板级十 748B 余量（dram0 溢出 29460）——系统池 188416→156672（LOAD_MAX +2KB 后再平）
# （-30720；板级七档位重平，D8 全链真机实测验证）。
# MP 基线批（2026-10-19）：4.5-rc1 静态面增长下 dram0 溢出 3388B——
# 145408→139264（−6144，余 ~2.7K 链接余量；标准档实测口径）。
CONFIG_HEAP_MEM_POOL_SIZE=131072
# MP 审计 R1/R2 防御（netbench 双 fail 同型——rx_q 缺省 1500/sysworkq
# 缺省 1024 在 4.5-rc1 部署突发下的 FATAL/静默腐蚀风险；heap 再让 8192）。
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# DRAM 三合一（WiFi+zenoh+WAMR）装不下默认值——DEC-29 每板动态预算裁剪：
# 装载缓冲按夹具尺寸级（286B wasm + 余量）；通道容量按本载体实际注册数
# （1 通道 dbled，留 8）。系统池不动（zenoh 会话峰值域 = 板级七实测档位）。
# 单元 I（MD2-D8）：demo 包 wasm 增大（v2 ~2.7KB）——装载缓冲
# 2048→4096（池预算已腾 30KB，覆盖之）。
CONFIG_TS_APP_LOAD_MAX=4096
# MD1.1（板级十一）：PWM 后端（D3 demo 限幅判据；periphbench 同款绑定）
CONFIG_PWM=y
CONFIG_TS_DRV_PWM=y
# PWM 驱动并入后 dram 再紧——通道容量 8→4（本载体注册 2 通道：dbled/dbpwm）
CONFIG_TS_SAFETY_MAX_CHANNELS=4

# 验签双区 scratch（DEC-49：最大 demo 包 payload ~3.5KB → 7168）
CONFIG_TS_VERIFY_SCRATCH=7168
# 4.5 复验批（同型防御）：verify 链在 4096 main 栈实测挂死（persistbench
# 实证——教训 31⑤ 同型）；8192 定值。
CONFIG_MAIN_STACK_SIZE=8192

# V0.4.0 M7c（Q-32①③）：双实例并行 + 槽池 4（overlay 槽 c/d）
CONFIG_TS_APP_MAX_INSTANCES=2
CONFIG_TS_STORE_SLOT_COUNT=4
# 双实例 WAMR 池（sim 实测 ~150KB/实例 → 板级 512KB@PSRAM）
CONFIG_TS_APP_WAMR_HEAP=524288
# M7c：双实例线程栈（2×8KB = 原单实例 16KB 总量；DRAM 预算守恒）
CONFIG_TS_APP_THREAD_STACK=8192
# M9（DR-15）：kv 面
CONFIG_TS_STORE_KV=y
