# thrdemo（V2 纵深批 M19b，DEC-55/Q-37 A）：D-THR demo 真机载体——
# 真 wasm 多线程全链（真 LLM 生成 threads=2 APP → 宿主侧 spawn 编排 →
# 原子共享 → join 汇合判据）。最小载体：无 store/net（wasm 直嵌经
# ts_appmgr_app_start——tests/app 同款 RAM 路径），判据 = console DT* 行。
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
# RAM store 后端（无 flash 分区依赖——wasm 直嵌 app_start；槽尺寸按夹具级裁）
CONFIG_TS_STORE=y
CONFIG_TS_STORE_SLOT_SIZE=16384
CONFIG_TS_STORE_SLOT_COUNT=2
CONFIG_TS_APP_WAMR=y
CONFIG_TS_APP_THREADS=y
CONFIG_TS_TEST=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=32768
