# estopbench（板级八）：estop chosen DT 绑定（DR-11）真机验证——GPIO9（BOOT
# 键脚）输入中断 → ISR 直达 force_all_fault（合同 5：不经协议栈/调度排队）
# → fault 态落通道 + 事后补发事件 + estop-clear 恢复。直启面（无 core_boot：
# estop_init 手动调用 = boot 步骤 1 同函数）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_NET=n
CONFIG_MAIN_THREAD_PRIORITY=15
