# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
# 真并行（竞态实验有效性）：native_sim 多核 pthread（posix 缺省即 builtin
# 原子；SMP 另需 USE_SWITCH——否则静默失效）
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_USE_SWITCH=y
# 双线程同优先级时间片（单核下也能制造窗口）
CONFIG_TIMESLICING=y
# 真实时间对齐（twister/TEST 默认快进——周期任务时序测量须对齐墙钟）
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
# sysworkq 内跑 WAMR（demo-02 需要）：exec_env 4KB + 解释器帧
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=32768
# 内核 tick 1ms（默认 10ms 粒度与测量周期同量级——降低测量底噪）
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
