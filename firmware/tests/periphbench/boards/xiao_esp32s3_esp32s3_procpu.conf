# 板级九：PWM/ADC 真后端使能（LED 使能节点随 overlay 点亮 → PWM_LED_ESP32/
# ADC_ESP32 默认 y）；板级内存片段（DEC-23/27 过渡值）。
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_TS_DRV_PWM=y
CONFIG_TS_DRV_ADC=y
CONFIG_TS_STORE_SLOT_SIZE=4096
# 4.5 复验批（同型防御）：verify 链在 4096 main 栈实测挂死（persistbench
# 实证——教训 31⑤ 同型）；8192 定值。
CONFIG_MAIN_STACK_SIZE=8192
