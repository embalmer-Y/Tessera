# P4 PSRAM 批板级片段（Waveshare ESP32-P4-WIFI6-DEV-KIT：32MB 16 线 PSRAM）。
# SPIRAM_MODE_HEX = P4 专属默认（16 线；S3 的 OCT/QUAD 不可用——Kconfig
# depends 已把守，显式声明自文档）。WAMR 堆 256KB = S3 板级六同值
# （DEC-27；P4 32MB 面下的更大值属内存预算批，不越权定）。
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_HEX=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
CONFIG_MAIN_STACK_SIZE=8192
