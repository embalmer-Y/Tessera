# ts-interact L1 测试（LLD-ts-interact §5）：核心逻辑直测（shell 运行时外）
CONFIG_ZTEST=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_HAL=y
CONFIG_TS_APPMGR=y
CONFIG_TS_APP_WAMR=y
CONFIG_TS_TEST=y
CONFIG_TS_INTERACT=y
# 栈防御（verify 链帧深——ztest 线程批量防御）
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
