# M1：ts-core + ts-safety 接入（design/LLD-ts-core / LLD-ts-safety）。
CONFIG_PRINTK=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y

# DEC-49：生产 app 同样承担安装/验签路径（twister smoke 即此构建）——
# tweetnacl 验签深度要求主栈 ≥8192（net_wq 已在模块内 8192）。
CONFIG_MAIN_STACK_SIZE=8192

# V3-1 flash 面（V2-2 既定待办）：分区 overlay 见 boards/*.overlay；
# store 基座可移植（native_sim = RAM 后端），flash/audit 走板级片段。
CONFIG_TS_STORE=y
