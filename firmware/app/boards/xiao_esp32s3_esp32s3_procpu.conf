# xiao_esp32s3 bring-up 内存预算（2026-09-26 板级批）
# 板：ESP32-S3 512KB SRAM；Zephyr 4.4 板级 DTS 无 psram 节点 → HLD §4.6 的 PSRAM 挂接
# （CONFIG_ESP_SPIRAM + WAMR 堆外置）暂不可用，本文件为内部 SRAM 过渡值。
# 出处：DEC-23（slot 尺寸每板可配）/ DEC-27（每板动态预算）/ HLD §4.6；
# RAM slot 后端（store/part.c）为 native_sim 替身，真板 flash 后端属板级任务。
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
