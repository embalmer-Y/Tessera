# xiao_esp32s3 每板预算（板级六起生效；DEC-23/27 + HLD §4.6）
# 板：ESP32-S3 512KB 内部 SRAM + N8R8 模组 8MB 八线 PSRAM。
# 板级六修正：早期"Zephyr 4.4 无 psram 节点、PSRAM 暂不可用"评估有误——
# psram0 节点在 esp32s3_common.dtsi，N8R8 模组 dtsi 定 8MB（octal）。
# WAMR 实例堆入 PSRAM（HLD §4.6 分层纪律：仅 APP 沙箱内存可入外部 RAM，
# 框架安全数据/zenoh/WAMR 运行时控制面留内部 SRAM）。
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_TS_APP_PSRAM_HEAP=y
CONFIG_TS_APP_WAMR_HEAP=262144
