# SPDX-License-Identifier: Apache-2.0
# Tessera CI（M0 骨架 + M1 L5/测试 + MA0 agent 接线；docs/std/testing.md §6）。
# job 顺序：repo-checks → l5-checks（安全合同机械检查，一票否决）→ agent-checks
#           → native-build → twister（L1/L2/L4）。
# 注：Zephyr 依赖经 west 钉在 v4.4.0 tag（DEC-19）；agent 依赖钉版见 agent/pyproject.toml（DEC-38 #1）。
name: ci

on:
  push:
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest 仓库检查（编码/无 BOM，军规 4）
        run: |
          pip install pytest
          pytest firmware/tests/pytest -v

  l5-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: L5 安全合同机械检查（testing.md §3，一票否决）
        run: python3 firmware/tests/l5/check_l5.py

  agent-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 agent（钉版，DEC-38 #1）
        run: pip install -e "agent[dev]"
      - name: ruff lint（Q-19 #11，含 asyncio 阻塞检查）
        run: ruff check agent
      - name: pytest（agent，L7）
        run: pytest agent/tests -v

  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 初始化 west 工作区（Zephyr v4.4.0，DEC-19）
        run: |
          pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.0 ~/ws
          cd ~/ws && west update
      - name: 构建 firmware/app @ native_sim
        run: |
          source ~/ws/zephyr/zephyr-env.sh
          west build -b native_sim "$GITHUB_WORKSPACE/firmware/app" -d build-app --pristine=always -- \
            -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/firmware/module/tessera"
      - name: twister 冒烟（framework.smoke @ native_sim）
        run: |
          source ~/ws/zephyr/zephyr-env.sh
          west twister -p native_sim -T "$GITHUB_WORKSPACE/firmware/tests" \
            --extra-args=ZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/firmware/module/tessera"
