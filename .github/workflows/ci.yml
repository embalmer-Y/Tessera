# SPDX-License-Identifier: Apache-2.0
# Tessera CI（M0 骨架 + M1 L5/测试 + MA0 agent 接线；docs/std/testing.md §6）。
# job 顺序：repo-checks → l5-checks（安全合同机械检查，一票否决）→ agent-checks
#           → native-build → twister（L1/L2/L4）。
# 注：Zephyr 依赖经 west 钉在 v4.5.0 正式版 tag（DEC-50 rc1 → V0.16.0 平移批正式版；agent 依赖钉版见 agent/pyproject.toml（DEC-38 #1））。
name: ci

on:
  push:
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest 仓库检查（编码/无 BOM，军规 4）
        run: |
          pip install pytest
          pytest firmware/tests/pytest -v

  l5-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: L5 安全合同机械检查（testing.md §3，一票否决）
        run: python3 firmware/tests/safety_check/check_safety_contract.py

  agent-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 agent（钉版，DEC-38 #1）
        run: pip install -e "agent[dev]"
      - name: 确保 clang（DEC-45 app_compile/wasm_build 测试硬依赖）
        run: if ! clang --version; then sudo apt-get update && sudo apt-get install -y clang; fi
      - name: ruff lint（Q-19 #11，含 asyncio 阻塞检查）
        run: ruff check agent
      - name: pytest（agent，L7；失败摘要进注解——可观测性，ffd50be 同理）
        run: |
          set +e
          pytest agent/tests -vv --tb=short 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -E '^E ' /tmp/pytest.log | head -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -30 /tmp/pytest.log
          fi
          exit "$rc"

  native-build:
    runs-on: ubuntu-24.04
    env:
      # native_sim 用主机工具链（本仓库全量测试的本地口径）——显式声明，
      # 避免"变体未设→探测 SDK→无 SDK 致命"（runner 不装 ~1GB SDK）。
      # 注：本地 WSL 之所以免设，是 Windows 侧 SDK 经 /mnt 互通被探测到。
      ZEPHYR_TOOLCHAIN_VARIANT: host
      # WAMR 源码根（钉版 WAMR-2.4.5，DEC-17/25；仓库不含三方源码）
      TS_WAMR_DIR: /home/runner/wamr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检出 WAMR 2.4.5（钉版，浅克隆）
        run: git clone --depth 1 --branch WAMR-2.4.5
              https://github.com/bytecodealliance/wasm-micro-runtime.git ~/wamr
      - name: 预生成 WAMR version.h + 只读屏障（竞态真除根——三次咬人后的实证结论）
        # version.cmake 的 configure_file 写共享源码树。板级八的"串行预生成"
        # 不除根（MD0-1 批第三次实证：CI 冷树 1/15 卡死 + 本地冷树 8/15
        # configure_file 报 No such file or directory；单套件绿、并行炸）：
        # 同内容的 configure_file 在共享输出路径上仍有临时文件写删动作，
        # 15 并发进程竞争即撕裂。真除根 = 预生成后 chmod 444——只读屏障
        # 强制全部进程走"比较相同→零写"路径（本地冷树 15/15 实证）。
        # 再生 version.h 须先 chmod 644（dev-env 教训 21⑤ 第三次修订）。
        run: |
          cmake -DWAMR_ROOT_DIR=$HOME/wamr -P ~/wamr/build-scripts/version.cmake
          chmod 444 ~/wamr/core/version.h
      - name: 主机构建依赖（Zephyr 官方 Ubuntu 清单，native_sim 32 位含 multilib）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache device-tree-compiler \
            wget python3-dev python3-pip xz-utils file make \
            gcc gcc-multilib g++-multilib libmagic1
      - name: 初始化 west 工作区（Zephyr v4.5.0 正式版，V0.16.0 平移批）
        run: |
          pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.5.0 ~/ws
          cd ~/ws && west update
          pip install -r ~/ws/zephyr/scripts/requirements.txt
      - name: 构建 firmware/app @ native_sim
        run: |
          source ~/ws/zephyr/zephyr-env.sh
          set -o pipefail
          west build -b native_sim "$GITHUB_WORKSPACE/firmware/app" -d build-app --pristine=always -- \
            -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE/firmware/module/tessera" 2>&1 | tee /tmp/build.log \
            || { echo "::error title=build-error::$(grep -B1 -A12 -m1 'CMake Error\|FATAL ERROR\|ERROR:' /tmp/build.log | tr '\n' '|')"; exit 1; }
      # 观察项（decisions 三条累计：2ac589e / bc6b9e8 / 3d99517——同型签名
      # native-build·twister·exit 2·无注解）：twister exit 2 = **启动期
      # 基础设施错误域**（工具链验证 E:/argparse/size_calc 的 sys.exit(2)——
      # 源码级核实），非测试失败（exit 1 = 异常/测试失败）。本步骤：
      # ① 显式 PIPESTATUS 捕获（twister-exit=行恒入日志）；
      # ② 失败转储模式扩域（E: / ERROR<空格>- / Build failure 等）+ \r 清洗
      #    + 空注解回退（三次间歇注解均空 = 设施盲区，本修根除）；
      # ③ 仅 rc==2 单次重试（infra 域码——rc==1 真失败**不重试不掩蔽**）；
      #    重试通过 = ::warning 显式留痕（infra-flake recovered）+ 证据上传；
      # ④ 任何失败/恢复证据（twister.log + twister.json）上传 artifact。
      - name: twister 全量（L1/L2/L4，16 套件 @ native_sim）
        id: twister
        env:
          TW_EXTRA: ZEPHYR_EXTRA_MODULES=${{ github.workspace }}/firmware/module/tessera
        run: |
          source ~/ws/zephyr/zephyr-env.sh
          set -o pipefail
          set +e
          west twister -p native_sim -T "$GITHUB_WORKSPACE/firmware/tests" \
            --outdir /tmp/twister-out \
            --extra-args="$TW_EXTRA" 2>&1 | tee /tmp/twister.log
          rc=${PIPESTATUS[0]}
          echo "twister-exit=$rc"
          if [ "$rc" -eq 0 ]; then exit 0; fi

          if [ "$rc" -eq 2 ]; then
            echo "=== rc==2（twister 启动期 infra 域：工具链验证/参数/size——非测试失败）。单次重试（仅此域码；rc==1 不重试）==="
            mv /tmp/twister.log /tmp/twister-attempt1.log
            west twister -p native_sim -T "$GITHUB_WORKSPACE/firmware/tests" \
              --outdir /tmp/twister-out2 \
              --extra-args="$TW_EXTRA" 2>&1 | tee /tmp/twister.log
            rc2=${PIPESTATUS[0]}
            echo "twister-retry-exit=$rc2"
            if [ "$rc2" -eq 0 ]; then
              echo "evidence=1" >> "$GITHUB_OUTPUT"
              echo "::warning title=twister-infra-flake::首次尝试 exit=2（twister 启动期 infra 域——非测试失败；观察项第 4 数据点），重试通过；两次日志已上传 artifact 供根因追踪"
              exit 0
            fi
            rc=$rc2
          fi

          echo "=== 失败诊断（twister 尾部 60 行）==="
          tail -60 /tmp/twister.log
          echo "=== 错误块（扩域匹配 + CR 清洗）==="
          grep -n -B2 -A10 -m3 -E 'E: |ERROR|Error|FAILED|Build failure|FATAL' /tmp/twister.log | tr -d '\r' || true
          echo "=== 环境上下文 ==="
          nproc; free -m | head -2
          msg="$(grep -B1 -A8 -m1 -E 'E: |CMake Error|FATAL ERROR|Build failure|ERROR' /tmp/twister.log | tr -d '\r' | tr '\n' '|' | head -c 900)"
          [ -n "$msg" ] || msg="twister exit=$rc（日志无匹配错误行——完整日志见 artifact）"
          echo "evidence=1" >> "$GITHUB_OUTPUT"
          echo "::error title=twister-error::$msg"
          exit "$rc"

      - name: 失败/恢复证据上传（twister 日志与报告）
        if: always() && steps.twister.outputs.evidence == '1'
        uses: actions/upload-artifact@v4
        with:
          name: twister-evidence
          path: |
            /tmp/twister.log
            /tmp/twister-attempt1.log
            /tmp/twister-out/twister.json
            /tmp/twister-out2/twister.json
          if-no-files-found: ignore
          retention-days: 30

